{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Login | Identiqo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'super_admin/css/dashboard.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>IDENTIQO</h1>
      <p>Super Admin Dashboard</p>
      {% if error %}
        <div class="alert-error">{{ error }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-grid">
          <div class="form-group">
            <label for="id_email">Email</label>
            {{ form.email }}
            {{ form.email.errors }}
          </div>
          <div class="form-group">
            <label for="id_password">Password</label>
            {{ form.password }}
            {{ form.password.errors }}
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.75rem;">Sign in</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
